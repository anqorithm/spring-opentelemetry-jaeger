spring.application.name=spring-opentelemetry-jaeger

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.sql.init.mode=always

mybatis.type-aliases-package=com.github.anqorithm.springopentelemetryjaeger.model
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

otel.service.name=spring-opentelemetry-jaeger
otel.traces.exporter=otlp
otel.exporter.otlp.endpoint=http://localhost:4317
otel.metrics.exporter=none
otel.logs.exporter=none

otel.instrumentation.spring-webmvc.enabled=true
otel.instrumentation.spring-web.enabled=true
otel.instrumentation.http.enabled=true
otel.instrumentation.jdbc.enabled=true
otel.instrumentation.hikaricp.enabled=true
otel.instrumentation.mybatis.enabled=true
otel.instrumentation.logback.enabled=true
otel.instrumentation.runtime-telemetry.enabled=true

otel.trace.sampler=always_on
otel.trace.span-processor=batch
otel.propagators=tracecontext,baggage
otel.resource.attributes.service.name=spring-opentelemetry-jaeger
otel.resource.attributes.service.version=1.0.0
otel.resource.attributes.deployment.environment=development

server.port=8080

logging.level.io.opentelemetry=INFO
logging.level.com.github.anqorithm.springopentelemetryjaeger=DEBUG
